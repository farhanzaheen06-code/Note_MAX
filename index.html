<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NoteMax" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>NoteMax</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark-mode sidebar-hidden notelist-hidden pages-hidden">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="app-name">NoteMax</span>
      <button class="icon-btn" id="closeSidebarBtn">✕</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="🔍 Search..." />
    </div>
    <div class="quick-filters">
      <button class="filter-btn active" data-filter="all">📄 All Notes <span class="count-badge" id="allCount">0</span></button>
      <button class="filter-btn" data-filter="pinned">📌 Pinned <span class="count-badge" id="pinnedCount">0</span></button>
      <button class="filter-btn" data-filter="favorites">❤️ Favorites <span class="count-badge" id="favCount">0</span></button>
      <button class="filter-btn" data-filter="trash">🗑 Trash <span class="count-badge" id="trashCount">0</span></button>
    </div>
    <div class="section-header">
      <span>Folders</span>
      <button class="icon-btn-sm" id="addFolderBtn">+</button>
    </div>
    <ul class="folders-list" id="foldersList"></ul>
    <div class="section-header">
      <span>Tags</span>
      <button class="icon-btn-sm" id="addTagBtn">+</button>
    </div>
    <div class="tags-list" id="tagsList"></div>
    <div class="sidebar-bottom">
      <button class="icon-btn-text" id="themeToggleBtn">🌓 Theme</button>
      <button class="icon-btn-text" id="settingsBtn">⚙️ Settings</button>
    </div>
  </aside>

  <section class="note-list" id="noteList">
    <div class="note-list-header">
      <div class="note-list-title" id="noteListTitle">All Notes</div>
      <div class="note-list-actions">
        <button class="icon-btn" id="sortBtn">⇅</button>
        <button class="new-note-btn" id="newNoteBtn">+ New</button>
        <button class="icon-btn" id="closeNoteListBtn">✕</button>
      </div>
    </div>
    <div class="sort-dropdown hidden" id="sortDropdown">
      <button class="sort-option active" data-sort="modified">Date Modified</button>
      <button class="sort-option" data-sort="created">Date Created</button>
      <button class="sort-option" data-sort="title">Title A–Z</button>
      <button class="sort-option" data-sort="title-desc">Title Z–A</button>
    </div>
    <div class="notes-container" id="notesContainer"></div>
  </section>

  <aside class="pages-sidebar" id="pagesSidebar">
    <div class="pages-header">
      <span class="pages-title">📖 Pages</span>
      <button class="icon-btn" id="closePagesBtn">✕</button>
    </div>
    <div class="pages-container" id="pagesContainer"></div>
    <button class="add-page-fab" id="addPageFab">+ Add Page</button>
  </aside>

  <main class="editor-panel" id="editorPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✏️</div>
      <h2>Welcome to NoteMax</h2>
      <p>Tap New Note to start.</p>
      <div class="empty-actions">
        <button class="primary-btn" id="emptyNewBtn">+ New Note</button>
        <button class="secondary-btn" id="emptyBrowseBtn">📂 Browse</button>
      </div>
    </div>

    <div class="editor-content hidden" id="editorContent">
      <div class="floating-toolbar" id="floatingToolbar">
        <div class="toolbar-group">
          <button class="tool-round" id="menuBtn" title="Menu">☰</button>
          <button class="tool-round" id="notesBtn" title="Notes">📄</button>
          <button class="tool-round" id="pagesBtn" title="Pages">📖</button>
          <button class="tool-round" id="undoBtn" title="Undo">↶</button>
          <button class="tool-round" id="redoBtn" title="Redo">↷</button>
        </div>

        <div class="toolbar-group pen-group">
          <button class="pen-tool" data-tool="select" title="Select">🎯</button>
          <button class="pen-tool pen-preset active" data-tool="pen" data-color="#ffffff" title="White">
            <div class="pen-visual" style="background:#ffffff"></div>
          </button>
          <button class="pen-tool pen-preset" data-tool="pen" data-color="#ff9500" title="Orange">
            <div class="pen-visual" style="background:#ff9500"></div>
          </button>
          <button class="pen-tool pen-preset" data-tool="pen" data-color="#34c759" title="Green">
            <div class="pen-visual" style="background:#34c759"></div>
          </button>
          <button class="pen-tool pen-preset" data-tool="pen" data-color="#ff453a" title="Red">
            <div class="pen-visual" style="background:#ff453a"></div>
          </button>
          <button class="pen-tool pen-preset" data-tool="pen" data-color="#5ac8fa" title="Blue">
            <div class="pen-visual" style="background:#5ac8fa"></div>
          </button>
          <button class="pen-tool" data-tool="highlighter" title="Highlighter">🖍</button>
          <button class="pen-tool" data-tool="eraser" title="Eraser">🧹</button>
          <button class="pen-tool" id="autoShapeBtn" title="Shapes">◇</button>
        </div>

        <div class="toolbar-group thickness-group">
          <button class="thickness-btn" data-size="1"><span class="thickness-dot" style="width:3px;height:3px"></span></button>
          <button class="thickness-btn" data-size="3"><span class="thickness-dot" style="width:5px;height:5px"></span></button>
          <button class="thickness-btn active" data-size="5"><span class="thickness-dot" style="width:8px;height:8px"></span></button>
          <button class="thickness-btn" data-size="10"><span class="thickness-dot" style="width:12px;height:12px"></span></button>
          <button class="thickness-btn" data-size="18"><span class="thickness-dot" style="width:16px;height:16px"></span></button>
        </div>

        <div class="toolbar-group">
          <button class="tool-round" id="addPageBtn" title="Add Page">+</button>
          <button class="tool-round" id="pinBtn" title="Pin">📌</button>
          <button class="tool-round" id="favBtn" title="Favorite">❤️</button>
          <button class="tool-round" id="exportNoteBtn" title="Export">💾</button>
          <button class="tool-round danger" id="deleteNoteBtn" title="Delete">🗑</button>
        </div>
      </div>

      <div class="page-header">
        <input type="text" id="titleInput" class="title-input-inline" placeholder="Untitled" />
        <div class="page-nav">
          <button class="page-nav-btn" id="prevPageBtn">‹</button>
          <span class="page-counter" id="pageCounter">1 / 1</span>
          <button class="page-nav-btn" id="nextPageBtn">›</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawingCanvas"></canvas>
      </div>

      <div class="pen-settings-panel hidden" id="penSettings">
        <div class="settings-title">✏️ Pen Settings</div>
        <div class="settings-row">
          <label>Color</label>
          <input type="color" id="penColorPicker" value="#ffffff" />
        </div>
        <div class="settings-row">
          <label>Size: <span id="penSizeValue">5</span>px</label>
          <input type="range" id="penSizeSlider" min="1" max="30" value="5" />
        </div>
        <div class="settings-row">
          <label>Opacity: <span id="opacityValue">100</span>%</label>
          <input type="range" id="penOpacity" min="10" max="100" step="5" value="100" />
        </div>
        <div class="settings-row">
          <label>Background</label>
          <select id="canvasBgSelect">
            <option value="dark" selected>Dark</option>
            <option value="white">White</option>
            <option value="lined">Lined</option>
            <option value="grid">Grid</option>
            <option value="dotgrid">Dot Grid</option>
            <option value="cream">Cream</option>
          </select>
        </div>
        <div class="settings-row toggle">
          <label>
            <input type="checkbox" id="scribbleEraseToggle" />
            <span>⚡ Scribble+Hold to Erase</span>
          </label>
        </div>
        <div class="settings-row toggle">
          <label>
            <input type="checkbox" id="shapeRecognitionToggle" />
            <span>🔷 Auto Shape Recognition</span>
          </label>
        </div>
        <div class="settings-row toggle">
          <label>
            <input type="checkbox" id="fingerDrawToggle" />
            <span>👆 Draw with Finger</span>
          </label>
        </div>
        <div class="settings-row toggle">
          <label>
            <input type="checkbox" id="beautifyToggle" />
            <span>✨ Beautify Handwriting</span>
          </label>
        </div>
        <div class="settings-row toggle">
          <label>
            <input type="checkbox" id="gesturesToggle" checked />
            <span>✌️ Two-Finger Gestures</span>
          </label>
        </div>
        <button class="close-panel-btn" id="closePenSettings">Done</button>
      </div>
    </div>
  </main>

  <div class="modal-overlay hidden" id="folderModal">
    <div class="modal">
      <div class="modal-header"><h3>New Folder</h3><button class="icon-btn" id="closeFolderModal">✕</button></div>
      <div class="modal-body">
        <input type="text" id="folderNameInput" placeholder="Folder name..." />
        <div class="folder-icon-picker"><span>Icon:</span><div class="icon-options" id="folderIconOptions"></div></div>
        <div class="folder-color-picker"><span>Color:</span><div class="color-options" id="folderColorOptions"></div></div>
        <button class="primary-btn" id="createFolderBtn">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="tagModal">
    <div class="modal">
      <div class="modal-header"><h3>Tags</h3><button class="icon-btn" id="closeTagModal">✕</button></div>
      <div class="modal-body">
        <div class="new-tag-row">
          <input type="text" id="newTagInput" placeholder="New tag..." />
          <input type="color" id="newTagColor" value="#6366f1" class="color-picker-btn" />
          <button class="primary-btn" id="createTagBtn">Create</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="exportModal">
    <div class="modal">
      <div class="modal-header"><h3>Export</h3><button class="icon-btn" id="closeExportModal">✕</button></div>
      <div class="modal-body export-options">
        <button class="export-btn" id="exportImg"><span>🖼</span><div><strong>PNG</strong></div></button>
        <button class="export-btn" id="exportPdf"><span>📋</span><div><strong>PDF</strong></div></button>
        <button class="export-btn" id="exportAll"><span>📦</span><div><strong>Backup</strong></div></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="settingsModal">
    <div class="modal modal-lg">
      <div class="modal-header"><h3>⚙️ Settings</h3><button class="icon-btn" id="closeSettingsModal">✕</button></div>
      <div class="modal-body settings-body">
        <div class="settings-section">
          <h4>Appearance</h4>
          <label>Theme
            <select id="themeSelect">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="sepia">Sepia</option>
            </select>
          </label>
        </div>
        <div class="settings-section">
          <h4>Data</h4>
          <button class="sm-btn" id="exportBackupBtn">📦 Export All</button>
          <button class="sm-btn" id="importBackupBtn">📥 Import</button>
          <input type="file" id="importFile" accept=".json" class="hidden" />
          <button class="sm-btn danger" id="clearAllDataBtn">🗑 Clear All</button>
        </div>
        <div class="settings-section">
          <h4>About</h4>
          <p class="about-text">NoteMax v6.0 - Buttery smooth writing</p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="backdrop hidden" id="backdrop"></div>

  <script src="db.js"></script>
  <script src="canvas.js"></script>
  <script src="editor.js"></script>
  <script src="export.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
